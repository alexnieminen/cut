    --shadow-lg:0 12px 40px #00000073, 0 2px 8px #0000004d;
  }
}
/* Frostier + solid when the user asks for less transparency (§14) */
@media (prefers-reduced-transparency: reduce){
  :root{ --chrome:#F9F9FB; }
  @media (prefers-color-scheme: dark){ :root{ --chrome:#18181A; } }
}

/* ============================================================
   Typography — tracking and leading are size-specific (§15).
   A single letter-spacing value is wrong at one end of the scale.
   ============================================================ */
.t-large  {font-size:34px; font-weight:700; letter-spacing:-.028em; line-height:1.06}
.t-title  {font-size:28px; font-weight:700; letter-spacing:-.022em; line-height:1.12}
.t-huge   {font-size:44px; font-weight:700; letter-spacing:-.032em; line-height:1;
           font-variant-numeric:tabular-nums}
.t-head   {font-size:17px; font-weight:600; letter-spacing:-.012em; line-height:1.3}
.t-body   {font-size:17px; font-weight:400; letter-spacing:-.011em; line-height:1.4}
.t-sub    {font-size:15px; font-weight:400; letter-spacing:-.006em; line-height:1.35}
.t-foot   {font-size:13px; font-weight:400; letter-spacing:-.001em; line-height:1.4}
.t-cap    {font-size:12px; font-weight:400; letter-spacing:0;       line-height:1.35}
/* small uppercase wants POSITIVE tracking — the opposite of the display sizes */
.t-section{font-size:13px; font-weight:600; letter-spacing:.045em; text-transform:uppercase;
           line-height:1.3; color:var(--label2)}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--bg); -webkit-text-size-adjust:100%}
html,body{margin:0; padding:0}
body{
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  letter-spacing:-.011em;
  background:var(--bg); color:var(--label);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit}
button,.row,.tab,.seg button{-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text; user-select:text}

/* ============================================================
   Layout — #clip contains the horizontally translating #stage,
   so the neighbouring days sit offscreen without creating a
   horizontal scrollbar.
   ============================================================ */
#clip{overflow-x:clip; position:relative}
/* Vertical scrolling stays the browser's job; horizontal is ours. Without
   this the OS competes for every horizontal move and the swipe feels like
   it's fighting you. */
#stage{position:relative; will-change:transform; touch-action:pan-y}
@supports (touch-action: pan-y pinch-zoom){
  #stage{touch-action:pan-y pinch-zoom}   /* keep accessibility zoom */
}
.pane{width:100%; max-width:620px; margin:0 auto;
      padding:max(4px,env(safe-area-inset-top)) 16px 0}
.pane.ghost{position:absolute; top:0; left:0; right:0;
            padding-top:max(4px,env(safe-area-inset-top))}

h1{margin:12px 0 2px}
.sectionhead{display:flex; align-items:baseline; justify-content:space-between;
             gap:10px; margin:26px 0 8px; padding:0 4px}
.sectionhead a{color:var(--blue); cursor:pointer; font-size:14px; font-weight:500}

/* ============================================================
   Cards + rows
   ============================================================ */
.card{background:var(--card); border-radius:var(--r-card); overflow:hidden; margin-bottom:12px}
.row{display:flex; align-items:center; gap:12px; padding:12px 16px;
     border-bottom:.5px solid var(--sep); position:relative; background:var(--card)}
.row:last-child{border-bottom:none}
.row .grow{flex:1; min-width:0}
.row .ttl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .sub2{color:var(--label2); margin-top:1px}
.val{font-variant-numeric:tabular-nums; color:var(--label2)}
.val.big{color:var(--label); font-weight:600}
.chev{color:var(--label3); flex:0 0 auto; font-size:19px; line-height:1}

/* Press feedback lands on pointer-DOWN, never on release (§1).
   Rows tint, controls scale — matching how iOS treats each. */
[data-press]{transition:background-color 130ms cubic-bezier(.25,.8,.35,1),
                        transform 130ms cubic-bezier(.25,.8,.35,1)}
.row[data-press].pressing{background:var(--press)}
.ctl[data-press].pressing{transform:scale(.965); opacity:.85}

/* ============================================================
   Controls
   ============================================================ */
input,select,textarea{color:var(--label); background:transparent; border:none; outline:none;
  font-variant-numeric:tabular-nums; font-size:17px; letter-spacing:-.011em}
input[type=number],input[type=text],input[type=date]{
  background:var(--fill); border-radius:9px; padding:8px 11px; width:100%; min-width:0}
input[type=number]{text-align:right; max-width:112px}
textarea{background:var(--fill); border-radius:var(--r-ctl); padding:11px 13px; width:100%;
  resize:vertical; min-height:88px; line-height:1.45; font-size:17px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font-size:17px; font-weight:600; letter-spacing:-.012em;
  background:var(--blue); color:#fff; border:none; border-radius:var(--r-ctl);
  padding:13px 18px; cursor:pointer; width:100%}
.btn.sec{background:var(--fill); color:var(--blue)}
.btn.dim{background:var(--fill); color:var(--label)}
.btn.danger{background:var(--fill); color:var(--red)}
.seg{display:flex; background:var(--fill); border-radius:10px; padding:2px; margin-bottom:12px;
     position:relative}
.seg .thumb{position:absolute; top:2px; bottom:2px; border-radius:8px; background:var(--card);
  box-shadow:0 1px 3px #00000021, 0 0 1px #0000001a; will-change:transform,width; z-index:0}
@media (prefers-color-scheme: dark){ .seg .thumb{background:#636366} }
.seg button{flex:1; position:relative; z-index:1; font-size:14px; font-weight:600;
  letter-spacing:-.006em; color:var(--label); background:none; border:none; border-radius:8px;
  padding:8px 4px; cursor:pointer}
.del{color:var(--red); font-size:20px; background:none; border:none; cursor:pointer;
     padding:2px 4px; line-height:1; flex:0 0 auto}
.add{color:var(--blue); font-size:15px; font-weight:600; background:none; border:none;
     cursor:pointer; padding:2px 6px; flex:0 0 auto}

/* ============================================================
   Rings + bars — driven by springs, animating transform/opacity
   only so they stay on the compositor (§11).
   ============================================================ */
.rings{display:flex; align-items:center; gap:18px; padding:18px 16px}
.ringwrap{position:relative; flex:0 0 auto}
.ringtxt{position:absolute; inset:0; display:flex; flex-direction:column;
         align-items:center; justify-content:center}
.ringtxt b{font-size:26px; font-weight:700; letter-spacing:-.022em;
           font-variant-numeric:tabular-nums; line-height:1}
.ringtxt span{font-size:11px; color:var(--label2); margin-top:2px; letter-spacing:0}
.macros{flex:1; display:flex; flex-direction:column; gap:9px; min-width:0}
.macro{display:flex; align-items:center; gap:9px}
.macro .nm{width:54px; color:var(--label2); flex:0 0 auto; font-size:13px}
.macro .bar{flex:1; height:7px; background:var(--fill); border-radius:4px; overflow:hidden}
.macro .bar i{display:block; height:100%; border-radius:4px; width:100%;
  transform:scaleX(0); transform-origin:left center; will-change:transform}
.macro .qt{flex:0 0 auto; font-variant-numeric:tabular-nums; color:var(--label2);
  font-size:12px; min-width:70px; text-align:right}

.kv{display:flex; justify-content:space-between; gap:12px; padding:9px 16px;
    font-size:15px; letter-spacing:-.006em; border-bottom:.5px solid var(--sep)}
.kv:last-child{border-bottom:none}
.kv span:last-child{font-variant-numeric:tabular-nums; font-weight:500}
.kv.tot{font-weight:600; font-size:17px; padding:12px 16px; letter-spacing:-.012em}
.pill{font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px; display:inline-block}
.pill.g{background:color-mix(in srgb,var(--green) 16%,transparent); color:var(--green)}
.pill.o{background:color-mix(in srgb,var(--orange) 18%,transparent); color:var(--orange)}
.pill.r{background:color-mix(in srgb,var(--red) 16%,transparent); color:var(--red)}
.note{font-size:13px; color:var(--label2); line-height:1.45; padding:11px 16px}
.warn{background:color-mix(in srgb,var(--orange) 12%,transparent); border-radius:var(--r-ctl);
  padding:11px 14px; font-size:13.5px; line-height:1.45; margin-bottom:12px}
.empty{padding:26px 16px; text-align:center; color:var(--label3); font-size:14.5px; line-height:1.5}
.chart{width:100%; height:170px; display:block}

/* ============================================================
   Swipe-to-delete
   ============================================================ */
.swipe{position:relative; overflow:hidden}
.swipe .surface{position:relative; z-index:1; will-change:transform}
.swipe .action{position:absolute; top:0; right:0; bottom:0; width:96px;
  background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:600; letter-spacing:-.006em; z-index:0; cursor:pointer}

/* ============================================================
   Chrome — a translucent floating layer, with a scroll edge
   effect instead of a hard 1px divider (§12).
   ============================================================ */
.tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; z-index:50;
  background:var(--chrome);
  backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:inset 0 .5px 0 var(--chrome-edge)}
/* No separate scroll-edge overlay. Painting a page-background gradient
   above the bar looks right over the page but stamps a grey band with a
   hard edge across any white card underneath it. The tab bar's own
   backdrop blur already does the separating. */
.tab{flex:1; background:none; border:none; padding:8px 2px 7px; cursor:pointer;
  font-size:10px; font-weight:500; letter-spacing:.005em; color:var(--label3);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  transition:color 180ms ease}
.tab.on{color:var(--blue)}
.tab svg{width:25px; height:25px; display:block; will-change:transform}

/* Materialise: blur + scale together, so a glass surface reads as
   arriving rather than fading in (§12). */
.sheet{position:fixed; left:10px; right:10px; z-index:60;
  bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--chrome);
  backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-radius:16px; padding:13px 15px; box-shadow:var(--shadow-lg);
  font-size:14px; line-height:1.45; display:flex; gap:11px; align-items:flex-start;
  will-change:transform,opacity}
.toast{position:fixed; left:50%; z-index:99; pointer-events:none;
  bottom:calc(90px + env(safe-area-inset-bottom));
  background:rgba(28,28,30,.86); color:#fff;
  backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  padding:11px 18px; border-radius:22px; font-size:14.5px; font-weight:500;
  max-width:88vw; text-align:center; opacity:0; will-change:transform,opacity}
@media (prefers-color-scheme: dark){ .toast{background:rgba(240,240,245,.9); color:#000} }

.datebar{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.datebar .nav{background:var(--fill); border:none; color:var(--blue); font-size:18px;
  width:32px; height:32px; border-radius:50%; cursor:pointer; line-height:1; flex:0 0 auto}
.datebar input{background:transparent; font-size:15px; color:var(--label2); padding:0; width:auto}
.dots{display:flex; gap:5px; align-items:center; margin-left:auto}
.dot{width:6px; height:6px; border-radius:50%; background:var(--label3)}
.dot.on{background:var(--blue)}

/* Contrast preference: give surfaces a real edge (§14) */
@media (prefers-contrast: more){
  .card,.tabbar,.sheet{border:1px solid var(--label2)}
  :root{--label2:#3C3C43CC; --sep:#3C3C4366}
}
/* Reduced motion: keep meaning, drop the vestibular load (§14) */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important}
  [data-press]{transition:background-color 90ms linear}
  .ctl[data-press].pressing{transform:none; opacity:.7}
}
</style>
</head>
<body>
<div id="clip"><div id="stage"><div class="pane" id="root"></div></div></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =================================================================
   CUT — single file, no dependencies, no network.
   Interaction model follows Apple's fluid-interface principles:
   respond on touch-down, track 1:1, project momentum, stay
   interruptible, and animate from the presentation value.
   ================================================================= */

var KEY = "cut_tracker_v1";

/* ---------- storage (degrades gracefully if localStorage is blocked) ---------- */
var Store = {
  ok: (function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
       catch(e){ return false; } })(),
  load: function(){ if(!this.ok) return null; try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } },
  save: function(d){ if(!this.ok) return false; try{ localStorage.setItem(KEY, JSON.stringify(d)); return true; }catch(e){ return false; } }
};

var DEFAULT_PROFILE = {
  age:18, height:187, sex:"m",
  bmr:2000,           // Mifflin-St Jeor: 2034 at 95 kg, 1984 at 90 kg
  stepCoef:0.055,
  gymKcal:300,
  restHR:60, maxHR:202, vo2max:45,
  margin:10,
  proteinTarget:185,
  deficit:900,
  goalWeight:90, goalBF:16,
  rateLow:0.7, rateHigh:0.9
};

var SEED_FOODS = [
  {n:"Profeel vanukas",        u:"1 pkt",   k:151, p:20,   c:11,   f:3},
  {n:"Protein scoop",          u:"1 scoop", k:113, p:22,   c:2,    f:1.5},
  {n:"Oltermanni slice",       u:"1 slice", k:70,  p:5,    c:0.5,  f:5},
  {n:"Reissumies slice",       u:"1 slice", k:85,  p:3,    c:16,   f:0.8},
  {n:"Fazer kaurasämpylä",     u:"1 pc",    k:85,  p:3,    c:15,   f:1},
  {n:"Chicken breast, cooked", u:"100 g",   k:165, p:31,   c:0,    f:3.6},
  {n:"Rice, white cooked",     u:"100 g",   k:130, p:2.7,  c:28,   f:0.3},
  {n:"Potato, boiled",         u:"100 g",   k:87,  p:2,    c:20,   f:0.1},
  {n:"Egg, large",             u:"1 egg",   k:72,  p:6.3,  c:0.4,  f:4.8},
  {n:"Oats, dry",              u:"100 g",   k:389, p:16.9, c:66,   f:6.9},
  {n:"Skyr / rahka, plain",    u:"100 g",   k:63,  p:11,   c:4,    f:0.2},
  {n:"Salmon",                 u:"100 g",   k:208, p:20,   c:0,    f:13},
  {n:"Banana, medium",         u:"1 pc",    k:105, p:1.3,  c:27,   f:0.4},
  {n:"Olive oil",              u:"1 tbsp",  k:119, p:0,    c:0,    f:13.5}
];

var S = Store.load() || {};
if(!S.profile) S.profile = {};
Object.keys(DEFAULT_PROFILE).forEach(function(k){ if(S.profile[k]===undefined) S.profile[k]=DEFAULT_PROFILE[k]; });
if(!S.foods) S.foods = SEED_FOODS.map(function(f,i){ return {id:"s"+i, n:f.n, u:f.u, k:f.k, p:f.p, c:f.c, f:f.f}; });
if(!S.days)  S.days = {};
if(!S.weights) S.weights = [];
if(!S.waist) S.waist = [];   // [{d, cm}] — kept separate so clearing a weight never wipes it

var view = "today";
var today = iso(new Date());
var cur = today;
var fbMode = "avg";

function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function shift(dstr,n){ var p=dstr.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return iso(d); }
function save(){ Store.save(S); }
function n1(x){ return Math.round(x*10)/10; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }
function el(id){ return document.getElementById(id); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function day(d){
  if(!S.days[d]) S.days[d] = {entries:[], steps:0, gym:false, football:null};
  var x = S.days[d];
  if(!x.entries) x.entries=[];
  return x;
}
function latestWeight(){
  if(S.weights.length){
    var s = S.weights.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; });
    return s[s.length-1].w;
  }
  return 95;
}

/* =================================================================
   Calorie logic — unchanged and independently tested.
   ================================================================= */
function keytelKcalMin(hr, w, age){
  return (-55.0969 + 0.6309*hr + 0.1988*w + 0.2017*age) / 4.184;
}
function hrrKcalMin(hr, w, rest, max, vo2max){
  var hrr = (hr - rest) / Math.max(1,(max - rest));
  hrr = Math.max(0, Math.min(1, hrr));
  var vo2 = hrr * (vo2max - 3.5) + 3.5;
  return (vo2/3.5) * 3.5 * w / 200;
}
function blockKcal(hr, mins, w, P){
  var k = keytelKcalMin(hr, w, P.age) * mins;
  var m = hrrKcalMin(hr, w, P.restHR, P.maxHR, P.vo2max) * mins;
  return {keytel:Math.max(0,k), hrr:Math.max(0,m), gross:Math.max(0,(k+m)/2)};
}
function footballCalc(fb, P, w){
  if(!fb) return null;
  var mins = +fb.mins || 0;
  if(fb.mode !== "zones" && mins <= 0) return null;
  var kSum=0, hSum=0, gSum=0, totMin=0, detail=[];

  if(fb.mode === "zones"){
    var mids = zoneMidpoints(P.maxHR);
    ["light","fat","cardio","peak"].forEach(function(z,i){
      var m = +fb.z[z] || 0;
      if(m<=0) return;
      var b = blockKcal(mids[i], m, w, P);
      kSum+=b.keytel; hSum+=b.hrr; gSum+=b.gross; totMin+=m;
      detail.push({label:zoneName(z), mins:m, hr:mids[i], kcal:b.gross});
    });
    if(totMin===0) return null;
    mins = totMin;
  } else {
    var hr = +fb.hr || 0;
    if(hr<=0) return null;
    var b2 = blockKcal(hr, mins, w, P);
    kSum=b2.keytel; hSum=b2.hrr; gSum=b2.gross;
    detail.push({label:"Whole session", mins:mins, hr:hr, kcal:b2.gross});
  }

  var bmrPart = (P.bmr/1440) * mins;
  var net = Math.max(0, gSum - bmrPart);
  var margin = net * (P.margin/100);
  var final = Math.max(0, net - margin);
  var stepsDup = (+fb.steps||0) * P.stepCoef;
  var spread = gSum>0 ? Math.abs(kSum-hSum)/gSum*100 : 0;

  return { mins:mins, gross:gSum, keytel:kSum, hrr:hSum, bmrPart:bmrPart,
    net:net, margin:margin, final:final, stepsDup:stepsDup,
    credited: Math.max(0, final - stepsDup), spread:spread, perMin: final/mins, detail:detail };
}
function zoneMidpoints(max){
  return [ Math.round(max*0.44), Math.round(max*0.595), Math.round(max*0.77), Math.round(max*0.92) ];
}
function zoneName(z){ return {light:"Below zones", fat:"Fat Burn", cardio:"Cardio", peak:"Peak"}[z]; }

function burn(d){
  var P=S.profile, x=day(d), w=latestWeight();
  var fb = footballCalc(x.football, P, w);
  var steps = (+x.steps||0) * P.stepCoef;
  var gym = x.gym ? +P.gymKcal : 0;
  var fbCal = fb ? fb.credited : 0;
  return { bmr:+P.bmr, steps:steps, gym:gym, football:fbCal, fb:fb, total:(+P.bmr)+steps+gym+fbCal };
}
function eaten(d){
  var x=day(d), t={k:0,p:0,c:0,f:0};
  x.entries.forEach(function(e){ t.k+=+e.k||0; t.p+=+e.p||0; t.c+=+e.c||0; t.f+=+e.f||0; });
  return t;
}

function parseLine(line){
  line = String(line).trim();
  if(!line) return null;
  var qty = 1;
  var qm = line.match(/^(\d+(?:[.,]\d+)?)\s*[x×]\s*/i);
  if(qm){ qty = parseFloat(qm[1].replace(",",".")); line = line.slice(qm[0].length); }

  if(line.indexOf("|") > -1){
    var parts = line.split("|").map(function(s){ return s.trim(); });
    var name = parts[0] || "Item";
    var nums = parts.slice(1).map(function(s){
      var v = parseFloat(String(s).replace(",",".").replace(/[^\d.\-]/g,""));
      return isNaN(v) ? 0 : v;
    });
    if(!nums.length) return null;
    return {n:name, k:(nums[0]||0)*qty, p:(nums[1]||0)*qty, c:(nums[2]||0)*qty, f:(nums[3]||0)*qty};
  }

  var p=0,c=0,f=0, rest=line, m;
  var reP=/(\d+(?:[.,]\d+)?)\s*g?\s*p(?:rot(?:ein)?)?\b/i;
  var reC=/(\d+(?:[.,]\d+)?)\s*g?\s*c(?:arbs?)?\b/i;
  var reF=/(\d+(?:[.,]\d+)?)\s*g?\s*f(?:at)?\b/i;
  if((m=rest.match(reP))){ p=parseFloat(m[1].replace(",",".")); rest=rest.replace(m[0]," "); }
  if((m=rest.match(reC))){ c=parseFloat(m[1].replace(",",".")); rest=rest.replace(m[0]," "); }
  if((m=rest.match(reF))){ f=parseFloat(m[1].replace(",",".")); rest=rest.replace(m[0]," "); }

  var k=0;
  var kx = rest.match(/(\d+(?:[.,]\d+)?)\s*(?:kcal|cals?|calories)\b/i);
  if(kx){ k=parseFloat(kx[1].replace(",",".")); rest=rest.replace(kx[0]," "); }
  else {
    var an = rest.match(/(?:^|\s)(\d+(?:[.,]\d+)?)(?=\s|$)/);
    if(an){ k=parseFloat(an[1].replace(",",".")); rest=rest.replace(an[0]," "); }
  }
  var nm = rest.replace(/[,\-–:]+/g," ").replace(/\s+/g," ").trim() || "Item";
  if(!k && !p && !c && !f) return null;
  if(!k) k = p*4 + c*4 + f*9;
  return {n:nm, k:k*qty, p:p*qty, c:c*qty, f:f*qty};
}
function parseBlock(text){ return String(text).split(/\r?\n/).map(parseLine).filter(Boolean); }

function sortedWeights(){ return S.weights.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; }); }
function movingAvg(arr, days){
  return arr.map(function(pt){
    var from = shift(pt.d, -(days-1));
    var win = arr.filter(function(q){ return q.d >= from && q.d <= pt.d; });
    var s = win.reduce(function(a,q){ return a+q.w; },0);
    return {d:pt.d, w:pt.w, avg:s/win.length, n:win.length};
  });
}
function weeklyRate(){
  var arr = sortedWeights();
  if(arr.length < 4) return null;
  var ma = movingAvg(arr, 7);
  var last = ma[ma.length-1];
  var target = shift(last.d, -7);
  var best=null, bestGap=1e9;
  ma.forEach(function(p){
    var gap = Math.abs(dayDiff(p.d, target));
    if(gap < bestGap){ bestGap=gap; best=p; }
  });
  if(!best || best.d === last.d) return null;
  var span = dayDiff(last.d, best.d);
  if(span < 3) return null;
  return {rate:(best.avg - last.avg) / span * 7, span:span, from:best, to:last, points:arr.length};
}
function dayDiff(a,b){
  var pa=a.split("-"), pb=b.split("-");
  return Math.round((new Date(+pa[0],+pa[1]-1,+pa[2]) - new Date(+pb[0],+pb[1]-1,+pb[2]))/86400000);
}

/* Waist is measured every few days rather than daily, so this compares the
   latest reading against the furthest one still inside a 28-day window that
   is at least 4 days older — enough separation for the change to mean
   something, close enough to still be current. */
function waistTrend(){
  var arr = S.waist.slice().sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  if(arr.length < 2) return null;
  var last = arr[arr.length-1], ref = null;
  for(var i=0;i<arr.length-1;i++){
    var gap = dayDiff(last.d, arr[i].d);
    if(gap >= 4 && gap <= 28){ ref = arr[i]; break; }
  }
  if(!ref){
    var prev = arr[arr.length-2];
    if(dayDiff(last.d, prev.d) < 2) return null;
    ref = prev;
  }
  return {cm:last.cm, delta:last.cm - ref.cm, days:dayDiff(last.d, ref.d),
          from:ref, points:arr.length};
}

/* =================================================================
   MOTION
   A spring is parameterised the way Apple exposes it — damping
   ratio and response — rather than mass/stiffness/damping, because
   those two map onto what you actually want to feel.

   Critically, retargeting keeps the CURRENT value and velocity.
   That is what makes an animation grabbable mid-flight without a
   jump, and what stops a reversal hitting a velocity brick wall.
   ================================================================= */
var reduceMotion = window.matchMedia
  ? window.matchMedia("(prefers-reduced-motion: reduce)")
  : {matches:false, addEventListener:function(){}};

function Spring(value, opts){
  opts = opts || {};
  this.value = value; this.target = value; this.velocity = 0;
  this.damping = opts.damping !== undefined ? opts.damping : 1.0;  // 1.0 = no overshoot
  this.response = opts.response !== undefined ? opts.response : 0.4;
  this.onUpdate = opts.onUpdate || function(){};
  this.onRest = opts.onRest || null;
  this.epsilon = opts.epsilon || 0.0015;
  this.resting = true;
}
Spring.prototype.set = function(v){   // hard set, no animation
  this.value = this.target = v; this.velocity = 0; this.resting = true;
  this.onUpdate(this.value);
};
Spring.prototype.to = function(target, velocity){
  this.target = target;
  if(velocity !== undefined) this.velocity = velocity;
  if(reduceMotion.matches){ this.set(target); return this; }
  if(this.resting){ this.resting = false; Driver.add(this); }
  return this;
};
Spring.prototype.nudge = function(v){ // add velocity without changing target
  this.velocity += v;
  if(this.resting){ this.resting = false; Driver.add(this); }
};
Spring.prototype.tick = function(dt){
  var w = 2*Math.PI/this.response, z = this.damping;
  // fixed sub-steps keep the integration stable when a frame is long
  var steps = Math.min(8, Math.max(1, Math.ceil(dt/0.004)));
  var h = dt/steps;
  for(var i=0;i<steps;i++){
    var a = -w*w*(this.value - this.target) - 2*z*w*this.velocity;
    this.velocity += a*h;
    this.value += this.velocity*h;
  }
  var scale = Math.max(1, Math.abs(this.target));
  if(Math.abs(this.value - this.target) < this.epsilon*scale &&
     Math.abs(this.velocity) < this.epsilon*scale*4){
    this.value = this.target; this.velocity = 0; this.resting = true;
    this.onUpdate(this.value);
    if(this.onRest) this.onRest();
    return false;
  }
  this.onUpdate(this.value);
  return true;
};

var Driver = {
  springs: [], running:false, last:0,
  add: function(s){
    if(this.springs.indexOf(s) === -1) this.springs.push(s);
    if(!this.running){ this.running = true; this.last = performance.now();
      requestAnimationFrame(this.frame.bind(this)); }
  },
  frame: function(now){
    var dt = Math.min(0.064, (now - this.last)/1000);   // clamp after a background tab
    this.last = now;
    for(var i=this.springs.length-1; i>=0; i--){
      if(!this.springs[i].tick(dt)) this.springs.splice(i,1);
    }
    if(this.springs.length){ requestAnimationFrame(this.frame.bind(this)); }
    else this.running = false;
  }
};

/* Momentum projection — Apple's exponential-decay form, not the
   textbook v²/2a. This is what makes a flick land where the gesture
   was actually heading. */
function project(velocity, decelerationRate){
  var d = decelerationRate === undefined ? 0.998 : decelerationRate;
  return (velocity/1000) * d / (1 - d);
}
/* Progressive resistance at a boundary: the further past, the less
   it follows. A hard stop reads as frozen; this reads as "nothing
   more here". */
function rubberband(overshoot, dimension, constant){
  var c = constant === undefined ? 0.55 : constant;
  return (overshoot * dimension * c) / (dimension + c * Math.abs(overshoot));
}
/* Velocity tracker — a short history, because the instantaneous
   delta between two events is far too noisy to hand to a spring. */
function Tracker(){ this.pts = []; }
Tracker.prototype.push = function(v){
  var t = performance.now();
  this.pts.push({v:v, t:t});
  while(this.pts.length > 6 || (this.pts.length > 2 && t - this.pts[0].t > 100)) this.pts.shift();
};
Tracker.prototype.velocity = function(){
  if(this.pts.length < 2) return 0;
  var a = this.pts[0], b = this.pts[this.pts.length-1];
  var dt = (b.t - a.t)/1000;
  return dt > 0.001 ? (b.v - a.v)/dt : 0;
};
Tracker.prototype.reset = function(){ this.pts.length = 0; };

function haptic(ms){ // silently absent on iOS Safari
  if(navigator.vibrate) try{ navigator.vibrate(ms||8); }catch(e){}
}

/* =================================================================
   PRESS — feedback on pointer-down, with drag-away cancel and a
   ~12px hysteresis so a scroll that starts on a row doesn't flash it.
   ================================================================= */
document.addEventListener("pointerdown", function(e){
  var t = e.target.closest && e.target.closest("[data-press]");
  if(!t) return;
  var sx = e.clientX, sy = e.clientY, done = false;
  t.classList.add("pressing");
  function off(){
    if(done) return; done = true;
    t.classList.remove("pressing");
    document.removeEventListener("pointermove", move, true);
    document.removeEventListener("pointerup", off, true);
    document.removeEventListener("pointercancel", off, true);
  }
  function move(ev){
    if(Math.abs(ev.clientX-sx) > 12 || Math.abs(ev.clientY-sy) > 12) off();
  }
  document.addEventListener("pointermove", move, true);
  document.addEventListener("pointerup", off, true);
  document.addEventListener("pointercancel", off, true);
}, true);

/* =================================================================
   TOAST — materialises rather than fading (§12)
   ================================================================= */
var toastSpring = null, toastTimer = null;
function toast(msg){
  var t = el("toast");
  t.textContent = msg;
  if(!toastSpring){
    toastSpring = new Spring(0, {damping:0.85, response:0.35, onUpdate:function(v){
      t.style.opacity = Math.max(0, Math.min(1, v));
      t.style.transform = "translateX(-50%) translateY("+((1-v)*14).toFixed(2)+"px) scale("+(0.94+0.06*v).toFixed(3)+")";
    }});
    toastSpring.set(0);
  }
  toastSpring.to(1);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastSpring.to(0); }, 1900);
}

function ringSVG(id, size, stroke, color){
  var r = (size - stroke)/2, cx = size/2, C = 2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--fill)" stroke-width="'+stroke+'"/>'+
    '<circle id="'+id+'" class="js-ring" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+color+
      '" stroke-width="'+stroke+
      '" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+
      '" transform="rotate(-90 '+cx+' '+cx+')"/></svg>';
}
var RING_C = 2*Math.PI*((104-11)/2);

/* A pane that isn't the live one (the day sliding in under your finger)
   gets its values written straight in. It must look finished the instant
   it becomes visible — animating a preview into place would be wrong,
   and leaving it at zero makes the incoming day look broken. */
function fillPane(pane, d){
  if(!pane) return;
  var P=S.profile, b=burn(d), e=eaten(d);
  var target = Math.max(0, b.total - P.deficit);
  var left = target - e.k;
  var frac = target>0 ? e.k/target : 0;

  var ring = pane.querySelector(".js-ring");
  if(ring){
    ring.setAttribute("stroke-dashoffset", RING_C * (1 - Math.max(0, Math.min(1, frac))));
    ring.setAttribute("stroke", frac > 1 ? "var(--red)" : "var(--blue)");
  }
  setText(pane, ".js-ringnum", Math.round(Math.abs(left)));
  setText(pane, ".js-ringlbl", left >= 0 ? "left" : "over");
  setBar(pane, "p", P.proteinTarget ? e.p/P.proteinTarget : 0, Math.round(e.p)+" / "+P.proteinTarget+"g");
  setBar(pane, "c", Math.min(1, e.c/300), Math.round(e.c)+"g");
  setBar(pane, "f", Math.min(1, e.f/110), Math.round(e.f)+"g");
  setBar(pane, "k", frac, Math.round(e.k)+" / "+Math.round(target));
  var bl = pane.querySelector(".js-burnline");
  if(bl) bl.innerHTML = 'Burn <b>'+Math.round(b.total)+'</b> − deficit <b>'+P.deficit+
    '</b> = eat <b>'+Math.round(target)+'</b> kcal'+
    (target<1500?' <span class="pill o">low day</span>':'');
}

/* ---------- Today: targeted updates, no innerHTML rebuild ----------
   Typing a step count must not tear down and rebuild the DOM. It
   patches the handful of nodes that actually changed, which is why
   focus is never stolen and there is no perceptible input latency. */
/* Everything below resolves elements by class within the LIVE pane rather
   than by global id. That's what lets a neighbouring pane be promoted to
   become the current one after a swipe — no ids to rename, no re-render. */
var todaySprings = null;
function livePane(){ return el("root"); }

function initTodaySprings(){
  var pane = livePane(); if(!pane) return;
  var ring = pane.querySelector(".js-ring");
  var num  = pane.querySelector(".js-ringnum");
  if(!ring || !num){ todaySprings = null; return; }
  todaySprings = {
    ring: new Spring(0, {damping:1.0, response:0.45, onUpdate:function(v){
      ring.setAttribute("stroke-dashoffset", RING_C * (1 - Math.max(0, Math.min(1, v))));
      ring.setAttribute("stroke", v > 1 ? "var(--red)" : "var(--blue)");
    }}),
    num: new Spring(0, {damping:1.0, response:0.5, onUpdate:function(v){
      num.textContent = Math.round(Math.abs(v));
    }}),
    p: barSpring(pane,"p"), c: barSpring(pane,"c"),
    f: barSpring(pane,"f"), k: barSpring(pane,"k")
  };
}
function barSpring(pane, m){
  var b = pane.querySelector('.js-bar[data-m="'+m+'"]');
  return new Spring(0, {damping:1.0, response:0.42, onUpdate:function(v){
    if(b) b.style.transform = "scaleX("+Math.max(0, Math.min(1, v)).toFixed(4)+")";
  }});
}
/* instant=true writes the values straight in with no animation — used when
   a pane arrives already showing the right numbers. */
function syncToday(instant){
  if(view !== "today") return;
  var pane = livePane(); if(!pane) return;
  var P=S.profile, b=burn(cur), e=eaten(cur);
  var target = Math.max(0, b.total - P.deficit);
  var left = target - e.k;
  var frac = target>0 ? e.k/target : 0;

  if(!todaySprings || !pane.contains(todaySprings.ring ? pane.querySelector(".js-ring") : null)){
    if(!todaySprings) initTodaySprings();
  }
  if(todaySprings){
    var go = instant ? "set" : "to";
    todaySprings.ring[go](frac);
    todaySprings.num[go](Math.abs(left));
    todaySprings.p[go](P.proteinTarget ? e.p/P.proteinTarget : 0);
    todaySprings.c[go](Math.min(1, e.c/300));
    todaySprings.f[go](Math.min(1, e.f/110));
    todaySprings.k[go](frac);
  }
  setText(pane, ".js-ringlbl", left>=0 ? "left" : "over");
  setText(pane, '.js-qt[data-m="p"]', Math.round(e.p)+" / "+P.proteinTarget+"g");
  setText(pane, '.js-qt[data-m="c"]', Math.round(e.c)+"g");
  setText(pane, '.js-qt[data-m="f"]', Math.round(e.f)+"g");
  setText(pane, '.js-qt[data-m="k"]', Math.round(e.k)+" / "+Math.round(target));
  setText(pane, ".js-stepkcal", Math.round(b.steps));
  setText(pane, ".js-outtot", Math.round(b.total));
  var bl = pane.querySelector(".js-burnline");
  if(bl) bl.innerHTML = 'Burn <b>'+Math.round(b.total)+'</b> − deficit <b>'+P.deficit+
    '</b> = eat <b>'+Math.round(target)+'</b> kcal'+
    (target<1500?' <span class="pill o">low day</span>':'');
}

/* The segmented thumb slides with a spring rather than a CSS
   transition, so tapping the other side mid-slide redirects it
   from where it currently is instead of jumping. */
var segSpring = null;
function positionSeg(animate){
  var seg = el("fbseg"), thumb = el("fbthumb");
  if(!seg || !thumb) return;
  var btns = seg.querySelectorAll("button");
  var idx = fbMode==="avg" ? 0 : 1;
  var w = btns[idx].offsetWidth;
  thumb.style.width = w+"px";
  var x = btns[idx].offsetLeft;
  if(!segSpring){
    segSpring = new Spring(x, {damping:1.0, response:0.35, onUpdate:function(v){
      var t = el("fbthumb"); if(t) t.style.transform = "translateX("+v.toFixed(2)+"px)";
    }});
    segSpring.set(x);
  } else if(animate) segSpring.to(x);
  else segSpring.set(x);
}

/* Waist read against the scale. This is the pairing that actually tells you
   what's happening: the scale moves with water and glycogen, the waist
   doesn't. When they disagree, the waist is usually the honest one. */
function waistSection(wr){
  var wt = waistTrend();
  var h = '<h2 class="t-section" style="margin:26px 0 8px 4px">Waist</h2><div class="card">';
  if(!wt){
    var n = S.waist.length;
    return h + '<div class="empty">'+(n ? "One reading so far ("+n1(S.waist[S.waist.length-1].cm)+
      " cm). Measure again in about a week and this starts working."
      : "Log it on the Today tab and it shows up here.")+'</div></div>';
  }
  var d = wt.delta, P = S.profile;
  var pill = d <= -0.3 ? '<span class="pill g">'+n1(d)+' cm</span>'
           : d >= 0.3  ? '<span class="pill r">+'+n1(d)+' cm</span>'
           : '<span class="pill o">'+(d>0?"+":"")+n1(d)+' cm · flat</span>';

  var msg;
  var rate = wr ? wr.rate : null;
  if(rate !== null && rate < P.rateLow && d <= -0.3){
    msg = "The scale is under your target rate but the waist is still coming down. "+
      "That's fat loss the scale is hiding behind water — completely normal on a deficit, "+
      "especially around hard football days. Don't cut calories on the back of this.";
  } else if(rate !== null && rate > P.rateHigh && Math.abs(d) < 0.3){
    msg = "Weight is dropping faster than target but the waist has barely moved. "+
      "Fast loss without a shrinking waist is usually water and lean mass rather than fat. "+
      "Worth eating a bit more and checking protein is hitting "+P.proteinTarget+" g.";
  } else if(d <= -0.3 && rate !== null && rate >= P.rateLow && rate <= P.rateHigh){
    msg = "Waist and scale are moving together. That's exactly what a well-run cut looks like — "+
      "nothing to change.";
  } else if(d >= 0.3){
    msg = "Waist is up over "+wt.days+" days. One reading can be off if you measured at a "+
      "different spot or after a big meal, so re-measure tomorrow morning before reading anything into it.";
  } else {
    msg = "Waist is holding steady. Over a couple more weeks it should track your weight down; "+
      "if the scale falls and this doesn't, the loss isn't mostly fat.";
  }
  return h +
    '<div class="kv"><span>Now</span><span>'+n1(wt.cm)+' cm</span></div>'+
    '<div class="kv"><span>Change over '+wt.days+' days</span><span>'+
      (d>0?"+":"")+n1(d)+' cm</span></div>'+
    '<div style="padding:12px 16px;border-top:.5px solid var(--sep)">'+
      '<div style="margin-bottom:7px">'+pill+'</div>'+
      '<div class="t-sub" style="color:var(--label2);line-height:1.5">'+msg+'</div>'+
    '</div></div>';
}
function ratePill(rate, P){
  var t = n1(rate)+" kg/week";
  if(rate < 0) return '<span class="pill r">gaining '+n1(-rate)+' kg/week</span>';
  if(rate < P.rateLow) return '<span class="pill o">'+t+' · slower than target</span>';
  if(rate > P.rateHigh) return '<span class="pill o">'+t+' · faster than target</span>';
  return '<span class="pill g">'+t+' · on target</span>';
}
function adviceCard(wr, P){
  var rate = wr.rate, mid = (P.rateLow+P.rateHigh)/2;
  var adj = -(rate - mid) * 7700 / 7;
  adj = Math.max(-300, Math.min(300, Math.round(adj/25)*25));
  var msg;
  if(rate >= P.rateLow && rate <= P.rateHigh){
    msg = "You're inside your target band. Don't change anything — the numbers you're using are working, "+
      "whatever the individual parts say.";
  } else if(rate < P.rateLow){
    msg = (rate<0?"The scale is going up. ":"You're losing slower than you want. ")+
      "The likeliest cause is intake being under-counted rather than burn being wrong — sauces, oil, drinks, "+
      "bites while cooking. Check those before cutting further. If it holds another week, drop intake by about "+
      Math.abs(adj)+" kcal/day.";
  } else {
    msg = "You're losing faster than your target. On a "+P.deficit+" deficit at 18 that's worth correcting, "+
      "not celebrating — fast loss above about 1 kg/week starts costing lean mass and recovery. Add roughly "+
      Math.abs(adj)+" kcal/day, mostly carbs around football.";
  }
  return '<div class="card"><div style="padding:14px 16px">'+
    '<div class="t-head" style="margin-bottom:5px">What to do</div>'+
    '<div class="t-sub" style="color:var(--label2);line-height:1.5">'+msg+'</div>'+
    '<div class="t-cap" style="color:var(--label3);margin-top:9px">Based on '+wr.span+
      ' days of 7-day averages, '+wr.points+' weigh-ins.</div></div></div>';
}
function etaText(w, P){
  var togo = w - P.goalWeight;
  if(togo <= 0) return "reached";
  var d1 = new Date(); d1.setDate(d1.getDate()+Math.round(togo/P.rateHigh*7));
  var d2 = new Date(); d2.setDate(d2.getDate()+Math.round(togo/P.rateLow*7));
  var f = function(d){ return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}); };
  return f(d1)+" – "+f(d2);
}
function chartSVG(ma){
  if(ma.length<2) return "";
  var W=560,H=170,pad=26;
  var vals = ma.map(function(p){ return p.w; }).concat(ma.map(function(p){ return p.avg; }));
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(max-min < 1){ var c=(max+min)/2; min=c-0.6; max=c+0.6; }
  var pd=(max-min)*0.15; min-=pd; max+=pd;
  var n=ma.length;
  var X=function(i){ return pad + (W-pad*2)*(n===1?0.5:i/(n-1)); };
  var Y=function(v){ return pad + (H-pad*2)*(1-(v-min)/(max-min)); };
  var dots="", raw="", avg="";
  ma.forEach(function(p,i){
    raw += (i?"L":"M")+X(i).toFixed(1)+","+Y(p.w).toFixed(1);
    avg += (i?"L":"M")+X(i).toFixed(1)+","+Y(p.avg).toFixed(1);
    dots += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.w).toFixed(1)+'" r="2.5" fill="var(--label3)"/>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<path d="'+raw+'" fill="none" stroke="var(--label3)" stroke-width="1.5" stroke-linejoin="round"/>'+dots+
    '<path d="'+avg+'" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<text x="'+pad+'" y="14" font-size="11" fill="var(--label3)">'+n1(max)+' kg</text>'+
    '<text x="'+pad+'" y="'+(H-6)+'" font-size="11" fill="var(--label3)">'+n1(min)+' kg</text></svg>';
}
function ledger(){
  var h="", tot=0, cnt=0;
  for(var i=6;i>=0;i--){
    var d = shift(today,-i);
    if(!S.days[d]) continue;
    var b=burn(d), e=eaten(d);
    if(!e.k && !b.football && !(+S.days[d].steps)) continue;
    var def = b.total - e.k; tot += def; cnt++;
    h += '<div class="kv"><span>'+new Date(d+"T12:00").toLocaleDateString(undefined,{weekday:"short"})+
      (e.k?'':' <span style="color:var(--label3)">(no food)</span>')+'</span><span>'+
      (def>=0?"−":"+")+Math.abs(Math.round(def))+'</span></div>';
  }
  if(!cnt) return '<div class="empty">Nothing logged in the last 7 days.</div>';
  return h + '<div class="kv tot"><span>Total deficit</span><span>'+Math.round(tot)+' kcal</span></div>'+
    '<div class="kv"><span>Predicted loss</span><span>'+n1(tot/7700)+' kg</span></div>';
}

function setWeight(v){

function dayHasContent(x){

/* Import MERGES rather than replaces. A straight overwrite meant loading an
   older backup silently destroyed everything logged since — and you'd only
   find out days later. Nothing here deletes: use Erase first if you genuinely
   want a clean restore. */
function mergeData(inc){
  var added = {days:0, weights:0, waist:0, foods:0}, kept = 0;

  var localLogged = Object.keys(S.days).filter(function(k){ return dayHasContent(S.days[k]); }).length;
  if(inc.profile && localLogged === 0){
    // nothing here yet — this is a restore, so the backup's settings are the real ones
    Object.keys(DEFAULT_PROFILE).forEach(function(k){
      if(inc.profile[k] !== undefined) S.profile[k] = inc.profile[k];
    });
  }

  Object.keys(inc.days || {}).forEach(function(k){
    var incoming = inc.days[k], mine = S.days[k];
    if(!dayHasContent(incoming)) return;
    if(!dayHasContent(mine)){ S.days[k] = incoming; added.days++; return; }
    // both have something: keep whichever actually holds more food
    var a = (incoming.entries||[]).length, b = (mine.entries||[]).length;
    if(a > b){ S.days[k] = incoming; added.days++; } else kept++;
  });

  var haveW = {}; S.weights.forEach(function(q){ haveW[q.d]=1; });
  (inc.weights || []).forEach(function(q){
    if(q && q.d && !haveW[q.d]){ S.weights.push(q); haveW[q.d]=1; added.weights++; }
  });
  var haveC = {}; S.waist.forEach(function(q){ haveC[q.d]=1; });
  (inc.waist || []).forEach(function(q){
    if(q && q.d && !haveC[q.d]){ S.waist.push(q); haveC[q.d]=1; added.waist++; }
  });

  var haveF = {}; S.foods.forEach(function(f){ haveF[String(f.n).toLowerCase()]=1; });
  (inc.foods || []).forEach(function(f){
    var key = String(f.n||"").toLowerCase();
    if(f && key && !haveF[key]){ S.foods.push({id:uid(), n:f.n, u:f.u||"", k:f.k, p:f.p, c:f.c, f:f.f});
      haveF[key]=1; added.foods++; }
  });
  return {added:added, kept:kept};
}

/* =================================================================
   DAY SWIPE
   1:1 tracking, rubber-band at today (there is no tomorrow to see),
   momentum projection on release, and the commit decision made on
   velocity SIGN rather than distance — a fast flick should commit
   even if it barely moved.
   ================================================================= */
var stageSpring = null, swipe = null;

function stageX(v){
  var s = el("stage");
  if(s) s.style.transform = "translate3d("+v.toFixed(2)+"px,0,0)";
}
function ensureStageSpring(){
  if(!stageSpring) stageSpring = new Spring(0, {damping:1.0, response:0.4, onUpdate:stageX});
  return stageSpring;
}

/* The neighbouring days are built ahead of the gesture and cached. Building
   them on the first pointermove cost 2–24ms of DOM work in the middle of a
   drag, which is exactly the wrong moment to spend a frame. */
var Ghosts = {
  day:null, prev:null, next:null,
  build:function(){
    if(view !== "today") return;
    if(this.day === cur && this.prev) return;      // already correct
    this.clear();
    this.prev = this.make(shift(cur,-1), -1);
    this.next = cur === today ? null : this.make(shift(cur,1), 1);
    this.day = cur;
  },
  make:function(d, side){
    var g = document.createElement("div");
    g.className = "pane ghost";
    g.style.transform = "translateX("+(side>0?100:-100)+"%)";
    g.innerHTML = viewToday(d, side>0 ? "_n" : "_p");
    el("stage").appendChild(g);
    fillPane(g, d);              // must look finished the instant it's visible
    g._day = d;
    return g;
  },
  clear:function(){
    var gs = document.querySelectorAll(".pane.ghost");
    for(var i=0;i<gs.length;i++) gs[i].remove();
    this.day = this.prev = this.next = null;
  },
  invalidate:function(){ this.day = null; },
  schedule:function(){
    var self = this;
    if(self._q) return;
    self._q = true;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ self._q = false; self.build(); });
    });
  }
};
function clearGhosts(){ Ghosts.clear(); }

document.addEventListener("pointerdown", function(e){
  if(view !== "today") return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  // A row that swipes to delete owns horizontal movement inside itself (§10):
  // detect both from the first move, then cancel the loser once intent is clear.
  if(e.target.closest && e.target.closest("[data-swipe-row]")) return;
  if(e.target.closest && e.target.closest("input,textarea,select,button")) return;

  var sp = ensureStageSpring();
  sp.onRest = null;          // never let a previous commit's callback survive a new grab
  Ghosts.build();            // cached, so this is usually free
  swipe = {
    id:e.pointerId, x0:e.clientX, y0:e.clientY,
    axis:null, base:sp.value,
    tracker:new Tracker(), w:window.innerWidth
  };
}, {passive:true});

document.addEventListener("pointermove", function(e){
  if(!swipe || e.pointerId !== swipe.id) return;
  var dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;

  if(!swipe.axis){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;   // hysteresis
    swipe.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if(swipe.axis === "y"){ swipe = null; return; }       // let the page scroll
    Ghosts.build();                                       // already cached
    document.body.style.userSelect = "none";
  }

  var raw = swipe.base + dx;
  // Rubber-band at today: dragging right reveals yesterday, dragging
  // left would reveal a day that hasn't happened.
  if(cur === today && raw < 0) raw = rubberband(raw, swipe.w);
  swipe.tracker.push(raw);
  ensureStageSpring().set(raw);
}, {passive:true});

function endSwipe(e){
  if(!swipe || (e && e.pointerId !== swipe.id)) return;
  var s = swipe; swipe = null;
  document.body.style.userSelect = "";
  if(s.axis !== "x"){ return; }

  var sp = ensureStageSpring();
  var v = s.tracker.velocity();
  // 0.99 rather than the scroll-tuned 0.998: this is a discrete page snap,
  // not free deceleration. At 0.998 a deliberate 40px drag projects ~180px
  // further and commits a day change the user never asked for.
  var projected = sp.value + project(v, 0.99);
  var w = s.w;

  // Commit on the projected landing point, but let a decisive flick win
  // outright — velocity sign carries the intent even over a short distance.
  var dir = 0;
  if(projected > w*0.35 || v > 550) dir = -1;             // swipe right → previous day
  else if((projected < -w*0.35 || v < -550) && cur !== today) dir = 1;

  var ghost = dir === -1 ? Ghosts.prev : dir === 1 ? Ghosts.next : null;
  if(dir && !ghost) dir = 0;                              // nothing to move to

  sp.onRest = null;
  sp.damping = dir ? 0.88 : 1.0;   // bounce only when momentum carried it (§4)
  sp.response = dir ? 0.32 : 0.38;

  if(dir){
    // Commit the day FIRST, then animate the already-correct pane home.
    // Deferring the swap to an onRest callback meant grabbing the stage
    // mid-flight could fire that callback and advance a day you didn't ask
    // for. Doing it now also makes the interruption trivially safe: you're
    // just dragging a pane that is already the right one.
    var startX = sp.value + (dir === -1 ? -w : w);
    promotePane(ghost, ghost._day);
    sp.set(startX);
    haptic(9);
  }
  sp.onRest = function(){
    sp.onRest = null;
    sp.damping = 1.0; sp.response = 0.4;
    Ghosts.schedule();             // rebuild neighbours once motion has settled
  };
  sp.to(0, v);   // hand the finger's exact velocity to the spring (§5)
}

/* Swap a neighbouring pane in as the live one. No re-render: the node
   already holds the right markup and numbers, so the day change costs
   nothing at the moment the gesture ends. */
function promotePane(g, d){
  var old = el("root");
  if(!g || !old) return;
  g.classList.remove("ghost");
  g.style.transform = "";
  old.removeAttribute("id");
  if(old.parentNode) old.parentNode.removeChild(old);
  g.id = "root";
  cur = d;
  Ghosts.clear();          // g survives: it is no longer .ghost
  todaySprings = null;
  initTodaySprings();
  syncToday(true);         // values are already on screen — don't animate them in
}
document.addEventListener("pointerup", endSwipe, {passive:true});
document.addEventListener("pointercancel", endSwipe, {passive:true});

/* =================================================================
   SWIPE TO DELETE
   ================================================================= */
var rowSwipe = null;
var ACTION_W = 96;

document.addEventListener("pointerdown", function(e){
  var row = e.target.closest && e.target.closest("[data-swipe-row]");
  if(!row) return;
  if(e.target.closest(".action")) return;
  var surf = row.querySelector(".surface");
  if(!surf) return;
  var cur0 = surf._x || 0;
  rowSwipe = {id:e.pointerId, x0:e.clientX, y0:e.clientY, axis:null,
              row:row, surf:surf, base:cur0, tracker:new Tracker()};
}, {passive:true});

document.addEventListener("pointermove", function(e){
  if(!rowSwipe || e.pointerId !== rowSwipe.id) return;
  var dx = e.clientX - rowSwipe.x0, dy = e.clientY - rowSwipe.y0;
  if(!rowSwipe.axis){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    rowSwipe.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if(rowSwipe.axis === "y"){ rowSwipe = null; return; }
  }
  var x = rowSwipe.base + dx;
  if(x > 0) x = rubberband(x, 200);              // resist pulling it the wrong way
  if(x < -ACTION_W) x = -ACTION_W + rubberband(x + ACTION_W, 200);
  rowSwipe.tracker.push(x);
  rowSwipe.surf._x = x;
  rowSwipe.surf.style.transform = "translate3d("+x.toFixed(2)+"px,0,0)";
}, {passive:true});

function endRowSwipe(e){
  if(!rowSwipe || (e && e.pointerId !== rowSwipe.id)) return;
  var r = rowSwipe; rowSwipe = null;
  if(r.axis !== "x") return;

  var v = r.tracker.velocity();
  var projected = (r.surf._x || 0) + project(v, 0.99);
  var open = projected < -ACTION_W/2 || v < -450;
  var target = open ? -ACTION_W : 0;

  var sp = new Spring(r.surf._x || 0, {damping: open ? 0.85 : 1.0, response:0.34,
    onUpdate:function(val){ r.surf._x = val; r.surf.style.transform = "translate3d("+val.toFixed(2)+"px,0,0)"; }});
  sp.to(target, v);
  if(open) haptic(6);
}
document.addEventListener("pointerup", endRowSwipe, {passive:true});
document.addEventListener("pointercancel", endRowSwipe, {passive:true});

/* The tapped tab icon springs — feedback that points at the outcome (§8) */
function bounceTab(id){
  var btn = document.querySelector('[data-tab="'+id+'"] svg');

  var s = new Spring(1, {damping:0.62, response:0.34, onUpdate:function(v){

  bar.innerHTML = '<div style="flex:1">Add this to your Home Screen and it opens like a real app — '+
    'tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>'+
    '<button class="ctl" data-press style="background:none;border:none;color:var(--blue);'+
    'font-size:14px;font-weight:600;cursor:pointer;padding:0 2px;flex:0 0 auto">Got it</button>';
  document.body.appendChild(bar);

  // Materialise in: scale and opacity together, so it reads as a surface arriving
  var s = new Spring(0, {damping:0.82, response:0.45, onUpdate:function(v){
    bar.style.opacity = Math.max(0, Math.min(1, v));
    bar.style.transform = "translateY("+((1-v)*20).toFixed(2)+"px) scale("+(0.93+0.07*v).toFixed(3)+")";
  }});
  s.set(0); setTimeout(function(){ s.to(1); }, 550);

  bar.querySelector("button").onclick = function(){
    try{ localStorage.setItem("cut_install_hint","1"); }catch(e){}
    var out = new Spring(1, {damping:1.0, response:0.3, onUpdate:function(v){
      bar.style.opacity = v;
      bar.style.transform = "translateY("+((1-v)*20).toFixed(2)+"px) scale("+(0.93+0.07*v).toFixed(3)+")";
    }, onRest:function(){ bar.remove(); }});
    out.to(0);
  };
})();
</script>
</body>
</html>
